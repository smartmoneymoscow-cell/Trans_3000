<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <!-- Canister body gradient -->
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a1515"/>
      <stop offset="20%" stop-color="#b81c1c"/>
      <stop offset="45%" stop-color="#d42222"/>
      <stop offset="55%" stop-color="#cc1e1e"/>
      <stop offset="80%" stop-color="#a81818"/>
      <stop offset="100%" stop-color="#7a1212"/>
    </linearGradient>
    <!-- Body highlight -->
    <linearGradient id="canHighlight" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
    <!-- Metallic rim -->
    <linearGradient id="rimMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="30%" stop-color="#777"/>
      <stop offset="70%" stop-color="#555"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <!-- Cap gradient -->
    <radialGradient id="capMetal" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="100%" stop-color="#444"/>
    </radialGradient>
    <!-- Fluid -->
    <linearGradient id="fluidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,200,50,0.8)"/>
      <stop offset="50%" stop-color="rgba(220,160,30,0.85)"/>
      <stop offset="100%" stop-color="rgba(180,120,20,0.9)"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="canShadow">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <!-- Handle -->
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="50%" stop-color="#888"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <!-- Label -->
    <linearGradient id="labelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="100" cy="285" rx="60" ry="10" fill="url(#canShadow)"/>

  <!-- === CANISTER BODY === -->
  <!-- Main body -->
  <rect x="35" y="55" width="130" height="210" rx="8" ry="8" fill="url(#canBody)"/>
  <!-- Highlight overlay -->
  <rect x="35" y="55" width="130" height="210" rx="8" ry="8" fill="url(#canHighlight)"/>

  <!-- Body ridges (structural lines) -->
  <line x1="38" y1="100" x2="162" y2="100" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="38" y1="160" x2="162" y2="160" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <line x1="38" y1="220" x2="162" y2="220" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- Side seam -->
  <line x1="100" y1="58" x2="100" y2="262" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

  <!-- === TOP RIM === -->
  <rect x="30" y="48" width="140" height="14" rx="4" fill="url(#rimMetal)"/>
  <rect x="30" y="48" width="140" height="3" rx="1" fill="rgba(255,255,255,0.12)"/>

  <!-- === BOTTOM RIM === -->
  <rect x="30" y="258" width="140" height="14" rx="4" fill="url(#rimMetal)"/>
  <rect x="30" y="258" width="140" height="3" rx="1" fill="rgba(255,255,255,0.06)"/>

  <!-- === CAP / NOZZLE === -->
  <!-- Cap base -->
  <rect x="80" y="32" width="40" height="20" rx="4" fill="url(#capMetal)"/>
  <rect x="80" y="32" width="40" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Cap top -->
  <rect x="85" y="22" width="30" height="14" rx="5" fill="#666" stroke="#777" stroke-width="1"/>
  <!-- Cap grip lines -->
  <line x1="90" y1="25" x2="90" y2="33" stroke="#888" stroke-width="0.5"/>
  <line x1="95" y1="25" x2="95" y2="33" stroke="#888" stroke-width="0.5"/>
  <line x1="100" y1="25" x2="100" y2="33" stroke="#888" stroke-width="0.5"/>
  <line x1="105" y1="25" x2="105" y2="33" stroke="#888" stroke-width="0.5"/>
  <line x1="110" y1="25" x2="110" y2="33" stroke="#888" stroke-width="0.5"/>
  <!-- Cap chain attachment -->
  <circle cx="118" cy="38" r="3" fill="#555" stroke="#666" stroke-width="1"/>

  <!-- === HANDLE === -->
  <path d="M55,48 Q55,15 80,15 L120,15 Q145,15 145,48" fill="none" stroke="url(#handleGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Handle highlight -->
  <path d="M58,46 Q58,18 82,18" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" stroke-linecap="round"/>

  <!-- === NOZZLE PORT (right side, where hose connects) === -->
  <rect x="162" y="110" width="22" height="16" rx="3" fill="#555" stroke="#666" stroke-width="1"/>
  <circle cx="173" cy="118" r="6" fill="#444" stroke="#555" stroke-width="1.5"/>
  <circle cx="173" cy="118" r="3" fill="#333"/>

  <!-- === "БЕНЗИН" LABEL === -->
  <rect x="48" y="130" width="104" height="50" rx="5" fill="url(#labelGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Label border inset -->
  <rect x="52" y="134" width="96" height="42" rx="3" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="1.5"/>
  <!-- БЕНЗИН text -->
  <text x="100" y="162" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="3">БЕНЗИН</text>
  <!-- Subtitle -->
  <text x="100" y="175" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="rgba(255,215,0,0.5)" text-anchor="middle" letter-spacing="1">GASOLINE</text>

  <!-- === FLUID LEVEL INDICATOR === -->
  <!-- Indicator strip on left side -->
  <rect x="40" y="70" width="8" height="180" rx="3" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <!-- Level markings -->
  <line x1="40" y1="90" x2="48" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <line x1="40" y1="130" x2="48" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <line x1="40" y1="170" x2="48" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <line x1="40" y1="210" x2="48" y2="210" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <!-- E and F labels -->
  <text x="36" y="93" font-family="Arial" font-size="6" fill="rgba(255,255,255,0.3)" text-anchor="end">F</text>
  <text x="36" y="248" font-family="Arial" font-size="6" fill="rgba(255,255,255,0.3)" text-anchor="end">E</text>

  <!-- === DECORATIVE DETAILS === -->
  <!-- Manufacturer stamp -->
  <circle cx="100" cy="220" r="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="100" y="223" font-family="Arial" font-size="6" fill="rgba(255,255,255,0.08)" text-anchor="middle">●</text>

  <!-- Capacity marking -->
  <text x="100" y="240" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.1)" text-anchor="middle">20L</text>

  <!-- Wear/scratch marks for realism -->
  <line x1="70" y1="190" x2="85" y2="192" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="120" y1="200" x2="140" y2="198" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  <circle cx="130" cy="100" r="1" fill="rgba(0,0,0,0.15)"/>

  <!-- Overall gloss -->
  <rect x="35" y="55" width="65" height="210" rx="8" fill="rgba(255,255,255,0.02)"/>
</svg>
