<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" width="220" height="320">
  <defs>
    <!-- Canister body gradient - rich red -->
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a1515"/>
      <stop offset="15%" stop-color="#b81c1c"/>
      <stop offset="35%" stop-color="#d42222"/>
      <stop offset="50%" stop-color="#e02828"/>
      <stop offset="65%" stop-color="#cc1e1e"/>
      <stop offset="85%" stop-color="#a81818"/>
      <stop offset="100%" stop-color="#7a1212"/>
    </linearGradient>
    <!-- Body highlight (glossy) -->
    <linearGradient id="canHighlight" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <!-- Metallic rim -->
    <linearGradient id="rimMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaa"/>
      <stop offset="30%" stop-color="#888"/>
      <stop offset="70%" stop-color="#666"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <!-- Cap gradient -->
    <radialGradient id="capMetal" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#555"/>
    </radialGradient>
    <!-- Fluid (gasoline) -->
    <linearGradient id="fluidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,210,60,0.85)"/>
      <stop offset="30%" stop-color="rgba(240,180,40,0.9)"/>
      <stop offset="70%" stop-color="rgba(220,150,25,0.92)"/>
      <stop offset="100%" stop-color="rgba(190,120,15,0.95)"/>
    </linearGradient>
    <!-- Fluid surface shimmer -->
    <linearGradient id="fluidShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,230,100,0.3)"/>
      <stop offset="50%" stop-color="rgba(255,210,60,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,230,100,0.25)"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="canShadow">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <!-- Handle -->
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#777"/>
      <stop offset="50%" stop-color="#999"/>
      <stop offset="100%" stop-color="#666"/>
    </linearGradient>
    <!-- Label background -->
    <linearGradient id="labelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <!-- Nozzle connector -->
    <radialGradient id="nozzleGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
    <!-- Indicator glass -->
    <linearGradient id="indicatorGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="110" cy="302" rx="70" ry="12" fill="url(#canShadow)"/>

  <!-- === CANISTER BODY === -->
  <!-- Main body -->
  <rect x="30" y="60" width="160" height="225" rx="10" ry="10" fill="url(#canBody)"/>
  <!-- Highlight overlay -->
  <rect x="30" y="60" width="160" height="225" rx="10" ry="10" fill="url(#canHighlight)"/>

  <!-- Body ridges -->
  <line x1="34" y1="110" x2="186" y2="110" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="34" y1="175" x2="186" y2="175" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <line x1="34" y1="240" x2="186" y2="240" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>

  <!-- Side seam -->
  <line x1="110" y1="63" x2="110" y2="282" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- === TOP RIM === -->
  <rect x="24" y="52" width="172" height="16" rx="5" fill="url(#rimMetal)"/>
  <rect x="24" y="52" width="172" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>

  <!-- === BOTTOM RIM === -->
  <rect x="24" y="278" width="172" height="16" rx="5" fill="url(#rimMetal)"/>
  <rect x="24" y="278" width="172" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>

  <!-- === CAP / NOZZLE === -->
  <!-- Cap base -->
  <rect x="90" y="34" width="50" height="22" rx="5" fill="url(#capMetal)"/>
  <rect x="90" y="34" width="50" height="5" rx="2" fill="rgba(255,255,255,0.18)"/>
  <!-- Cap top -->
  <rect x="95" y="22" width="40" height="16" rx="6" fill="#777" stroke="#888" stroke-width="1.5"/>
  <!-- Cap grip ridges -->
  <line x1="100" y1="25" x2="100" y2="35" stroke="#999" stroke-width="0.7"/>
  <line x1="105" y1="25" x2="105" y2="35" stroke="#999" stroke-width="0.7"/>
  <line x1="110" y1="25" x2="110" y2="35" stroke="#999" stroke-width="0.7"/>
  <line x1="115" y1="25" x2="115" y2="35" stroke="#999" stroke-width="0.7"/>
  <line x1="120" y1="25" x2="120" y2="35" stroke="#999" stroke-width="0.7"/>
  <line x1="125" y1="25" x2="125" y2="35" stroke="#999" stroke-width="0.7"/>
  <line x1="130" y1="25" x2="130" y2="35" stroke="#999" stroke-width="0.7"/>
  <!-- Cap chain -->
  <circle cx="138" cy="42" r="3" fill="#666" stroke="#777" stroke-width="1"/>
  <path d="M138,45 Q142,50 140,55" fill="none" stroke="#555" stroke-width="1" stroke-linecap="round"/>

  <!-- === HANDLE === -->
  <path d="M60,52 Q60,14 90,14 L140,14 Q170,14 170,52" fill="none" stroke="url(#handleGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Handle highlight -->
  <path d="M63,50 Q63,18 93,18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === NOZZLE PORT (right side) === -->
  <!-- Port housing -->
  <rect x="188" y="125" width="28" height="22" rx="4" fill="#444" stroke="#555" stroke-width="1.5"/>
  <!-- Port opening -->
  <circle cx="202" cy="136" r="8" fill="url(#nozzleGrad)" stroke="#333" stroke-width="1.5"/>
  <circle cx="202" cy="136" r="4.5" fill="#1a1a1a"/>
  <!-- Ribbed connector texture -->
  <line x1="188" y1="130" x2="188" y2="142" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <line x1="191" y1="128" x2="191" y2="144" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <line x1="213" y1="128" x2="213" y2="144" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- === FLUID LEVEL INDICATOR (left side, glass tube) === -->
  <!-- Indicator background -->
  <rect x="36" y="78" width="14" height="195" rx="4" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Glass overlay -->
  <rect x="36" y="78" width="14" height="195" rx="4" fill="url(#indicatorGlass)"/>

  <!-- Level markings with percentages -->
  <line x1="36" y1="95" x2="50" y2="95" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
  <text x="33" y="98" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="end" font-weight="bold">100</text>

  <line x1="36" y1="140" x2="50" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <text x="33" y="143" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end" font-weight="bold">75</text>

  <line x1="36" y1="185" x2="50" y2="185" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <text x="33" y="188" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end" font-weight="bold">50</text>

  <line x1="36" y1="230" x2="50" y2="230" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <text x="33" y="233" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="end" font-weight="bold">25</text>

  <line x1="36" y1="268" x2="50" y2="268" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/>
  <text x="33" y="271" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="end" font-weight="bold">0</text>

  <!-- Percentage sign -->
  <text x="33" y="85" font-family="Arial, sans-serif" font-size="5" fill="rgba(255,255,255,0.25)" text-anchor="end">%</text>

  <!-- === "БЕНЗИН" LABEL === -->
  <rect x="58" y="140" width="104" height="60" rx="6" fill="url(#labelBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Label gold border -->
  <rect x="62" y="144" width="96" height="52" rx="4" fill="none" stroke="rgba(255,215,0,0.35)" stroke-width="1.5"/>
  <!-- БЕНЗИН text -->
  <text x="110" y="174" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="3">БЕНЗИН</text>
  <!-- GASOLINE subtitle -->
  <text x="110" y="189" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,215,0,0.45)" text-anchor="middle" letter-spacing="2">GASOLINE</text>

  <!-- === DECORATIVE === -->
  <!-- Manufacturer stamp -->
  <circle cx="110" cy="235" r="14" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="110" y="238" font-family="Arial" font-size="7" fill="rgba(255,255,255,0.08)" text-anchor="middle">★</text>

  <!-- Capacity marking -->
  <text x="110" y="260" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.12)" text-anchor="middle">20L</text>

  <!-- Wear marks -->
  <line x1="75" y1="205" x2="90" y2="207" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <line x1="130" y1="215" x2="150" y2="213" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>

  <!-- Overall gloss strip (left side) -->
  <rect x="30" y="60" width="80" height="225" rx="10" fill="rgba(255,255,255,0.025)"/>
</svg>
